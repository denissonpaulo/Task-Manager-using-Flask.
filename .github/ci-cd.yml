name: DevSecOps Task Manager CI Pipeline

on:
  push:
    branches: [ "production", "staging", "development" ]
  pull_request:
    branches: [ "production", "staging", "development" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório para a máquina virtual do pipeline
    - name: Checkout source code
      uses: actions/checkout@v3

    # 2. Configura o ambiente com a versão correta do Python (3.11)
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # 3. Executa a Etapa de Compilação/Interpretação e Verificação de Dependências
    - name: Install dependencies and Verify Environment
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Entra na subpasta correta e executa os testes automatizados
    - name: Run Automated Tests
      working-directory: ./todo_project
      run: |
        python test_app.py