name: Task-Manager-CI

on:
 push:
  branches: [ "development", "staging", "production" ]
 pull_request:
  branches: [ "development", "staging", "production" ]

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
     python-version: '3.11'

  - name: Install dependencies
    run: |
     python -m pip install --upgrade pip
     pip install -r requirements.txt

# === NOVO STAGE: ANÁLISE ESTÁTICA DE CÓDIGO (SAST) ===
  - name: Run SAST Security Scan (Bandit)
    run: |
     pip install bandit
     bandit -r todo_project/ -f txt || echo "Avisos de vulnerabilidade encontrados"

# === NOVO STAGE: ANÁLISE DE DEPENDÊNCIAS ===
  - name: Run Dependency Vulnerability Audit
    run: |
     pip install pip-audit
     pip-audit -r requirements.txt || echo "Dependências antigas detectadas"

  - name: Run Tests
    run: |
     cd todo_project
     python test_app.py
