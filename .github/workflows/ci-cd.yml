name: Task-Manager-CI

on:
 push:
  branches: [ "development", "staging", "production" ]
 pull_request:
  branches: [ "development", "staging", "production" ]
 workflow_dispatch:

# =====================================================================
# JOB 1: COMPILAÇÃO, TESTES E ANÁLISE ESTÁTICA (SAST & SCA)
#
jobs:
 build:
  runs-on: ubuntu-latest

  steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
     python-version: '3.11'

  - name: Install dependencies
    run: |
     python -m pip install --upgrade pip
     pip install -r requirements.txt

# === NOVO STAGE: ANÁLISE ESTÁTICA DE CÓDIGO (SAST) ===
  - name: Run SAST Security Scan (Bandit - OWASP ASV Core)
    run: |
     pip install bandit
     bandit -r todo_project/ -f txt || echo "Avisos de vulnerabilidade encontrados"

# === NOVO STAGE: ANÁLISE DE DEPENDÊNCIAS ===
  - name: Run OWASP Dependency-Check Vulnerability Audit (pip-audit)
    run: |
     pip install pip-audit
     pip-audit -r requirements.txt || echo "Dependências antigas detectadas"

  - name: Run Tests
    run: |
     cd todo_project
     python test_app.py

# =====================================================================
# ETAPA 6 & 7: ENTREGA CONTÍNUA (CD) E ANÁLISE DINÂMICA REAL (DAST)
# ====================================================================
  
# 1. Ambiente Temporário de Review para Pull Requests
 review-environment:
  if: github.event_name == 'pull_request'
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Code
     uses: actions/checkout@v3

   - name: Create Temporary Review Environment
     run: |
      echo "Criando ambiente temporário de Review para o Pull Request..."
      echo "Simulando subida do container efêmero da aplicação para avaliação manual."

# =====================================================================
# JOB 3: IMPLANTAÇÃO UNIFICADA EM STAGE E VARREDURA DINÂMICA REAL (DAST)
# =====================================================================
 deploy-and-dast-stage:
  needs: build
  runs-on: ubuntu-latest
  permissions:
   issues: write
   contents: write
  steps:
   - name: Checkout Code
     uses: actions/checkout@v3

# Constrói a imagem Docker baseada no Dockerfile local na nuvem
   - name: Build Stage Docker Image
     run: |
      docker build -t task-manager-app:stage .

# Inicializa o container em background na porta 5000 da máquina virtual do pipeline
   - name: Run Stage Container in Background
     run: |
      docker run -d --name stage-app -p 5000:5000 task-manager-app:stage

# Script de tolerância: Garante que o ZAP só inicia quando o Flask responder com sucesso
   - name: Wait for Application to be Healthy
     run: |
      echo "Aguardando inicialização do servidor Flask do Task Manager..."
      timeout 30s sh -c 'until curl -s http://localhost:5000 > /dev/null; do sleep 2; done'
      echo "Aplicação de pé e respondendo com sucesso em http://localhost:5000!"

# SOLUÇÃO DE PRIVILÉGIO: Cria pasta específica e dá posse ao UID 1000 do ZAP
   - name: Criar Diretório Seguro para Relatórios do ZAP
     run: |
      sudo chown -R 1000:1000 ${{ github.workspace }}

# Executa o DAST real contra a sua aplicação containerizada ativa no localhost do runner
   - name: Run OWASP ZAP Baseline Scan on Real Local App
     uses: zaproxy/action-baseline@v0.12.0
     with:
      target: 'http://localhost:5000'
      cmd_options: '-r zap_report.html -J zap_report.json'
      fail_action: false
      allow_issue_writing: true

# SEGURANÇA E LIMPEZA: Restaura as permissões originais para o runner do GitHub
   - name: Restaurar Permissões do Workspace
     if: always()
     run: |
      sudo chown -R runner:docker ${{ github.workspace }}

# Preserva os artefatos gerados pelo escaneamento para que você possa baixar
   - name: Archive Security Reports
     uses: actions/upload-artifact@v4
     with:
      name: zap-security-reports
      path: |
       zap_report.html
       zap_report.json